<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Price Predictor</title>
<style>
:root{--bg:#f6f7fa;--ink:#1d2433;--mu:#6b7385;--line:#dfe3ea;--accent:#2457c5;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151f;--ink:#e8ebf2;--mu:#98a1b5;--line:#2a3142;--accent:#6c9bff;--card:#181d2a}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font:600 18px/1.2 Georgia,"Times New Roman",serif;margin:0 0 10px}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:110px}
input[type=number]{min-width:80px;width:80px}
button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:6px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>Stock Price Predictor</h1>
  <form id="f">
    <label>Ticker<input name="ticker" value="AAPL" maxlength="12" required></label>
    <label>History<select name="period"><option>6mo</option><option selected>1y</option><option>2y</option><option>5y</option></select></label>
    <label>Model<select name="model">
      <option value="ensemble">Ensemble</option><option value="gradient_boosting">Gradient boosting</option>
      <option value="random_forest">Random forest</option><option value="ridge">Ridge</option></select></label>
    <label>Forecast days<input name="forecast" type="number" min="1" max="30" value="7"></label>
    <button id="go">Run prediction</button>
  </form>
</header>
<main>
  <div id="msg">Choose a ticker and select Run prediction.</div>
  <iframe id="out" title="Prediction report" hidden></iframe>
</main>
<script>
const f=document.getElementById('f'),out=document.getElementById('out'),msg=document.getElementById('msg'),go=document.getElementById('go');
f.addEventListener('submit',e=>{
  e.preventDefault();
  const q=new URLSearchParams(new FormData(f)).toString();
  go.disabled=true;go.textContent='Running...';msg.hidden=false;msg.textContent='Training models for '+f.ticker.value.toUpperCase()+'...';out.hidden=true;
  out.onload=()=>{go.disabled=false;go.textContent='Run prediction';msg.hidden=true;out.hidden=false};
  out.src='/report?'+q;
});
</script>
</body>
</html>
